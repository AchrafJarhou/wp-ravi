[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice

[www]
user = www-data
group = www-data
listen = /var/run/php-fpm/www.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; Clear env
clear_env = no

; Access log
access_log = /proc/self/fd/1

; Timeouts
request_terminate_timeout = 300
