[global]
pid = /run/php-fpm.pid
error_log = /var/log/php-fpm.log
log_level = warning

[www]
user = www-data
group = www-data
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; Clear env
clear_env = no

; Timeouts
request_terminate_timeout = 300
