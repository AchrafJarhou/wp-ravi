[global]
pid = /run/php-fpm.pid
error_log = /var/log/php-fpm.log
log_level = warning

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10

; Clear env
clear_env = no

; Timeouts
request_terminate_timeout = 300
